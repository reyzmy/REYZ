<style>
/* Layout: a cartoon wooden room. Phone = scene on top, links below. Desktop = scene left, links right. */
:root{
  --wood:#c28a55; --wood-line:#a8703f; --wall:#d6a26b; --wall-line:#bf8a52;
  --floor:#8a5a33; --ink:#2b2118; --paper:#ffffff; --muted:#6b5442;
  --sky:#9fd8f0; --sun:#ffd04a; --shutter:#7fb38a; --palm:#4f8a5b;
  --green:#3fae2a; --body-a:#f08a3c; --body-b:#8e3b2c; --head:#ffffff;
  --title:#ffffff; --key:#ff5714; --peach:#ffb098;
  --brand:"Archivo","Arial Black",system-ui,sans-serif;
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --text:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wood:#4a3222; --wood-line:#3a261a; --wall:#5a3d29; --wall-line:#4a3121;
  --floor:#2f1f15; --ink:#1a120c; --paper:#fbf6ee; --muted:#6b5442;
  --sky:#1f2d55; --sun:#f3ecc8; --shutter:#4f7a5b; --palm:#24432f;
  --green:#3fae2a; --body-a:#e07a2e; --body-b:#8e3b2c; --head:#fbf6ee; --title:#fff7e6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --wood:#4a3222; --wood-line:#3a261a; --wall:#5a3d29; --wall-line:#4a3121;
  --floor:#2f1f15; --ink:#1a120c; --paper:#fbf6ee; --muted:#6b5442;
  --sky:#1f2d55; --sun:#f3ecc8; --shutter:#4f7a5b; --palm:#24432f;
  --green:#3fae2a; --body-a:#e07a2e; --body-b:#8e3b2c; --head:#fbf6ee; --title:#fff7e6;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--text);
  background:var(--wood);
  background-image:repeating-linear-gradient(90deg,var(--wood) 0 62px,var(--wood-line) 62px 65px);
}
.page{
  max-width:1060px; margin:0 auto;
  padding-block:28px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid; gap:24px; align-items:start;
}
@media (min-width:880px){
  .page{grid-template-columns:1.1fr 1fr; gap:48px; padding-block:56px 56px; align-items:center; min-height:100%}
  .scene-wrap{position:sticky; top:40px}
}
.col{display:flex; flex-direction:column; gap:20px; min-width:0; max-width:520px; width:100%; margin:0 auto}

/* Scene */
.scene{
  width:100%; max-width:100%; display:block;
  border:4px solid var(--ink); border-radius:28px; overflow:hidden;
  background:var(--wall);
  background-image:repeating-linear-gradient(90deg,var(--wall) 0 46px,var(--wall-line) 46px 49px);
  box-shadow:0 8px 0 var(--ink);
}
.s{stroke:var(--ink); stroke-width:4; stroke-linecap:round; stroke-linejoin:round}
.s3{stroke:var(--ink); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; fill:none}
.fill-ink{fill:var(--ink)} .fill-head{fill:var(--head)} .fill-sky{fill:var(--sky)}
.fill-sun{fill:var(--sun)} .fill-shutter{fill:var(--shutter)} .fill-palm{fill:var(--palm)}
.fill-floor{fill:var(--floor)} .fill-a{fill:var(--body-a)} .fill-b{fill:var(--body-b)}
.fill-paper{fill:var(--paper)} .fill-green{fill:var(--green)} .none{fill:none}
.bubble-text{font-family:var(--display); font-weight:800; font-size:19px; fill:var(--ink)}
.wood-frame{fill:var(--floor)}

.wave{transform-origin:286px 160px; animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-22deg)}80%{transform:rotate(4deg)}90%{transform:rotate(-18deg)}}
.blink{transform-box:fill-box; transform-origin:center; animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.yarn{transform-box:fill-box; transform-origin:center; animation:roll 6s linear infinite}
@keyframes roll{to{transform:rotate(360deg)}}
.bubble{transform-box:fill-box; transform-origin:20% 100%; animation:pop .6s cubic-bezier(.3,1.6,.5,1) .2s both}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

/* Header */
.head{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center}
.avatar{
  width:96px; height:96px; border-radius:26px; background:var(--peach);
  border:4px solid var(--ink); box-shadow:0 5px 0 var(--ink); display:grid; place-items:center;
  transform:rotate(-4deg);
}
.fill-key{fill:var(--key)} .fill-peach{fill:var(--peach)}
.k-line > *{stroke:var(--ink); stroke-width:3.2; stroke-linejoin:round}
.key{transform-origin:50% 10%; animation:jiggle 5s ease-in-out infinite}
@keyframes jiggle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(9deg)}94%{transform:rotate(-6deg)}}
h1{
  margin:0; font-family:var(--brand); font-weight:900; font-stretch:125%; line-height:.95;
  font-size:clamp(2.3rem,9vw,3.3rem); color:var(--title); letter-spacing:-.5px; text-transform:lowercase;
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),0 3px 0 var(--ink),3px 0 0 var(--ink);
  text-wrap:balance;
}
.tagline{
  margin:0; background:var(--paper); color:var(--ink);
  border:3px solid var(--ink); border-radius:999px; padding:8px 16px;
  font-weight:800; font-size:1.02rem; box-shadow:0 4px 0 var(--ink);
}
.tagline mark{background:var(--key); color:#fff; padding:1px 8px; border-radius:8px; border:2px solid var(--ink)}

/* Links */
.links{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px}
.link{
  display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--ink);
  background:var(--paper); border:3px solid var(--ink); border-radius:20px;
  padding:10px 16px 10px 10px; box-shadow:0 5px 0 var(--ink);
  transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease, color .15s ease;
  animation:rise .5s cubic-bezier(.3,1.4,.5,1) both; animation-delay:calc(var(--i) * 70ms + 150ms);
}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
.link:hover,.link:focus-visible{transform:translateY(-3px) rotate(-.6deg); box-shadow:0 8px 0 var(--ink); background:var(--key); color:#fff}
.link:hover .lbl span,.link:focus-visible .lbl span{color:#fff}
.link:active{transform:translateY(3px); box-shadow:0 2px 0 var(--ink); background:var(--key); color:#fff}
.link:focus-visible{outline:4px solid var(--paper); outline-offset:3px}
.ico{
  flex:none; width:48px; height:48px; border-radius:14px; border:3px solid var(--ink);
  display:grid; place-items:center;
}
.ico svg{width:28px; height:28px}
.yt .ico{background:#ff2a2a} .tt .ico{background:#111} .fb .ico{background:#1877f2}
.ig .ico{background:linear-gradient(45deg,#fdc04a,#f0503c 45%,#c33aa0 75%,#6a4ad6)}
.th .ico{background:#111} .x .ico{background:#111}
.lbl{display:flex; flex-direction:column; min-width:0; flex:1}
.lbl b{font-family:var(--display); font-weight:800; font-size:1.2rem; line-height:1.1}
.lbl span{font-size:.88rem; color:var(--muted); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.arrow{flex:none; width:26px; height:26px}
footer{text-align:center; font-weight:800; font-size:.85rem; color:var(--title); text-shadow:1px 1px 0 var(--ink)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}
</style>
</head>
