<style>
/* Layout: a cartoon wooden room with the Kita Rungkai cast. Phone = scene on top, links below. Desktop = scene left, links right. */
:root{
  --wood:#c28a55; --wood-line:#a8703f; --wall:#d6a26b; --wall-line:#bf8a52;
  --floor:#8a5a33; --ink:#241726; --paper:#ffffff; --face:#ffffff; --face-sh:#eef0f6;
  --sky:#9fd8f0; --sun:#ffd04a; --shutter:#7fb38a; --palm:#4f8a5b;
  --key:#ff520d; --peach:#ffb098; --title:#ffffff;
  --brand:"Archivo","Arial Black",system-ui,sans-serif;
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --text:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wood:#4a3222; --wood-line:#3a261a; --wall:#5a3d29; --wall-line:#4a3121;
  --floor:#2f1f15; --ink:#1a1019; --paper:#fbf6ee; --face:#ffffff; --face-sh:#e6e8f0;
  --sky:#1f2d55; --sun:#f3ecc8; --shutter:#4f7a5b; --palm:#24432f; --title:#fff7e6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --wood:#4a3222; --wood-line:#3a261a; --wall:#5a3d29; --wall-line:#4a3121;
  --floor:#2f1f15; --ink:#1a1019; --paper:#fbf6ee; --face:#ffffff; --face-sh:#e6e8f0;
  --sky:#1f2d55; --sun:#f3ecc8; --shutter:#4f7a5b; --palm:#24432f; --title:#fff7e6;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--text);
  background:var(--wood);
  background-image:repeating-linear-gradient(90deg,var(--wood) 0 62px,var(--wood-line) 62px 65px);
}
.page{
  max-width:1060px; margin:0 auto;
  padding-block:28px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid; grid-template-columns:minmax(0,1fr); gap:24px; align-items:start;
}
@media (min-width:880px){
  .page{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:48px; padding-block:56px; align-items:center; min-height:100%}
  .scene-wrap{position:sticky; top:40px}
}
.col{display:flex; flex-direction:column; gap:20px; min-width:0; max-width:520px; width:100%; margin:0 auto}

/* Scene */
.scene{
  width:100%; max-width:100%; display:block;
  border:4px solid var(--ink); border-radius:28px; overflow:hidden;
  background:var(--wall);
  background-image:repeating-linear-gradient(90deg,var(--wall) 0 46px,var(--wall-line) 46px 49px);
  box-shadow:0 8px 0 var(--ink);
}
.scene .o{stroke:var(--ink); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.scene .ln{fill:none; stroke-linecap:round; stroke-linejoin:round}
.f-ink{fill:var(--ink)} .f-face{fill:var(--face)} .f-sky{fill:var(--sky)} .f-sun{fill:var(--sun)}
.f-shutter{fill:var(--shutter)} .f-palm{fill:var(--palm)} .f-floor{fill:var(--floor)}
.f-paper{fill:var(--paper)} .f-key{fill:var(--key)} .f-peach{fill:var(--peach)}
.s-ink{stroke:var(--ink)}
.bubble-text{font-family:var(--display); font-weight:800; font-size:15px; fill:var(--ink)}
.yarn{transform-box:fill-box; transform-origin:center; animation:roll 6s linear infinite}
@keyframes roll{to{transform:rotate(360deg)}}
.bubble{transform-box:fill-box; transform-origin:20% 100%; animation:pop .6s cubic-bezier(.3,1.6,.5,1) .2s both}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.anim{transform-box:fill-box; transform-origin:50% 100%}
.tug{animation:tug .45s ease-out}
@keyframes tug{40%{transform:translateX(-6px) rotate(-6deg)}}
.jump{animation:jump .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes jump{40%{transform:translateY(-18px)}}
.hit{cursor:pointer; outline:none}
.hit:focus-visible .ring{stroke:var(--paper); stroke-width:4}
.hint{animation:hint 1.2s ease-in-out infinite}
@keyframes hint{50%{transform:translateY(-4px)}}
.ring{fill:none; stroke:var(--key); stroke-width:3; stroke-dasharray:6 5; animation:spin 8s linear infinite; transform-box:fill-box; transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.hint-text{font-family:var(--display); font-weight:800; font-size:13px; fill:var(--ink)}
.loose{fill:none; stroke:var(--key); stroke-width:3; stroke-linecap:round; transition:stroke-dashoffset .5s ease}

/* Fact card under the scene */
.scene-wrap{display:flex; flex-direction:column; gap:14px}
.fact{
  background:var(--paper); border:3px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink);
  padding:14px 16px; display:flex; flex-direction:column; gap:10px; color:var(--ink);
}
.fact-top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.fact-label{font-family:var(--display); font-weight:800; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase}
.dots{display:flex; gap:5px}
.dots i{width:11px; height:11px; border-radius:50%; border:2px solid var(--ink); background:transparent; transition:background-color .2s}
.dots i.on{background:var(--key)}
.fact p{margin:0; font-weight:800; font-size:1.05rem; line-height:1.4; min-height:2.8em; text-wrap:pretty}
.fact p em{font-style:normal; color:var(--key)}
.fact p a{color:var(--key)}
.btns{display:flex; gap:10px; flex-wrap:wrap}
.btn{
  font:800 1.05rem/1 var(--display); color:#fff; background:var(--key); cursor:pointer;
  border:3px solid var(--ink); border-radius:999px; padding:10px 20px 8px; box-shadow:0 4px 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-2px); box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--paper); outline-offset:2px}
.btn.alt{background:var(--paper); color:var(--ink)}

/* Header */
.head{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center}
.avatar{
  width:96px; height:96px; border-radius:26px; background:var(--peach);
  border:4px solid var(--ink); box-shadow:0 5px 0 var(--ink); display:grid; place-items:center;
  transform:rotate(-4deg);
}
.key{width:40px; height:72px; overflow:visible; transform-origin:50% 10%; animation:jiggle 5s ease-in-out infinite}
.key path,.key circle{fill:var(--key); stroke:var(--ink); stroke-width:1.6; stroke-linejoin:round; paint-order:stroke}
@keyframes jiggle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(9deg)}94%{transform:rotate(-6deg)}}
h1{
  margin:0; font-family:var(--brand); font-weight:900; font-stretch:125%; line-height:.95;
  font-size:clamp(2.3rem,9vw,3.3rem); color:var(--title); letter-spacing:-.5px; text-transform:lowercase;
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),0 3px 0 var(--ink),3px 0 0 var(--ink);
  text-wrap:balance;
}
.tagline{
  margin:0; background:var(--paper); color:var(--ink);
  border:3px solid var(--ink); border-radius:999px; padding:8px 16px;
  font-weight:800; font-size:1.02rem; box-shadow:0 4px 0 var(--ink);
}
.tagline mark{background:var(--key); color:#fff; padding:1px 8px; border-radius:8px; border:2px solid var(--ink)}

/* Links */
.links{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px}
.link{
  display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--ink);
  background:var(--paper); border:3px solid var(--ink); border-radius:20px;
  padding:10px 16px 10px 10px; box-shadow:0 5px 0 var(--ink);
  transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease, color .15s ease;
  animation:rise .5s cubic-bezier(.3,1.4,.5,1) both; animation-delay:calc(var(--i) * 70ms + 150ms);
}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
.link:hover,.link:focus-visible{transform:translateY(-3px) rotate(-.6deg); box-shadow:0 8px 0 var(--ink); background:var(--key); color:#fff}
.link:active{transform:translateY(3px); box-shadow:0 2px 0 var(--ink); background:var(--key); color:#fff}
.link:focus-visible{outline:4px solid var(--paper); outline-offset:3px}
.ico{
  flex:none; width:48px; height:48px; border-radius:14px; border:3px solid var(--ink);
  display:grid; place-items:center;
}
.ico svg{width:28px; height:28px}
.yt .ico{background:#ff2a2a} .tt .ico{background:#111} .fb .ico{background:#1877f2}
.ig .ico{background:linear-gradient(45deg,#fdc04a,#f0503c 45%,#c33aa0 75%,#6a4ad6)}
.th .ico{background:#111} .x .ico{background:#111}
.lbl{flex:1; min-width:0; font-family:var(--display); font-weight:800; font-size:1.25rem; line-height:1.1}
.arrow{flex:none; width:26px; height:26px}
footer{text-align:center; font-weight:800; font-size:.85rem; color:var(--title); text-shadow:1px 1px 0 var(--ink)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}
</style>
</head>

<script>
(function () {
  var FACTS = [
    ["Jarum jam berpusing ke kanan ikut arah ", "bayang jam matahari", " di hemisfera utara."],
    ["Tumbler yang kemek cepat hilang sejuk sebab ", "ruang vakum", " dalam dindingnya dah terjejas."],
    ["Pintu tandas awam tak cecah lantai supaya ", "senang dicuci", ", ada pengudaraan dan mudah dibantu bila kecemasan."],
    ["Kuning telur jadi hijau kelabu bila direbus terlalu lama, sebab ", "sulfur bertemu besi", "."],
    ["Epal yang dipotong jadi perang sebab enzimnya bertindak balas dengan ", "oksigen", ". Jus lemon boleh lambatkan."],
    ["Ulat dalam tong sampah sebenarnya ", "larva lalat rumah", " yang menetas dari telur."],
    ["Suara dalam kepala kita datang dari ", "Area Broca", " di otak, tanpa gerakkan mulut."]
  ];
  var SAYS = ["Tahu tak?", "Oooh!", "Betul ke?", "Wah!", "Hah, macam tu!", "Patutlah!", "Fuh!"];
  var YT = "https://www.youtube.com/@kitarungkai";
  var $ = function (id) { return document.getElementById(id); };
  var boy = $("boy"), yarn = $("yarn"), scaleG = $("yarnScale"), thread = $("thread"), loose = $("loose");
  var say = $("say"), bubble = $("bubble"), text = $("factText"), label = $("factLabel");
  var dots = $("dots").children, pullBtn = $("pullBtn"), resetBtn = $("resetBtn"), hint = $("hint");
  var faces = ["smile", "grin", "shock", "laugh"];
  var n = 0, faceTimer;

  function show(el, on) { if (on) el.removeAttribute("hidden"); else el.setAttribute("hidden", ""); }
  function face(f) { faces.forEach(function (k) { show($("f-" + k), k === f); }); }
  function play(el, cls) { el.classList.remove(cls); void el.getBBox(); el.classList.add(cls); }
  function speak(s) { say.textContent = s; play(bubble, "bubble"); }
  function layout() {
    var s = n >= FACTS.length ? 0 : 1 - 0.09 * n, r = 20 * s, cy = 213 - r;
    yarn.setAttribute("transform", "translate(" + (262 - 6 * n) + " " + cy + ")");
    scaleG.setAttribute("transform", "scale(" + Math.max(s, 0.001) + ")");
    var tx = 262 - 6 * n - 0.8 * r, ty = cy - 0.4 * r;
    thread.setAttribute("d", s ? "M162 154 Q" + ((162 + tx) / 2) + " " + (Math.max(154, ty) + 22) + " " + tx + " " + ty
                               : "M162 154 Q176 190 190 206");
    loose.setAttribute("stroke-dashoffset", String(100 - (100 * n) / FACTS.length));
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i < n);
  }
  function pull() {
    if (n >= FACTS.length) return;
    var f = FACTS[n]; n++;
    show(hint, false);
    play(boy, "tug");
    face(n % 2 ? "shock" : "grin");
    clearTimeout(faceTimer); faceTimer = setTimeout(function () { face("smile"); }, 1400);
    layout();
    label.textContent = "Fakta " + n + " / " + FACTS.length;
    text.innerHTML = "";
    text.append(f[0]); var em = document.createElement("em"); em.textContent = f[1]; text.append(em, f[2]);
    if (n >= FACTS.length) {
      speak("Siap dirungkai!");
      clearTimeout(faceTimer); face("laugh");
      setTimeout(function () {
        label.textContent = "Semua dah dirungkai!";
        text.innerHTML = 'Nak lagi? Tonton cerita penuh di <a href="' + YT + '" target="_blank" rel="noopener">YouTube Kita Rungkai</a>.';
      }, 2600);
      pullBtn.hidden = true; resetBtn.hidden = false;
    } else speak(SAYS[(n - 1) % SAYS.length]);
  }
  function reset() {
    n = 0; layout(); face("smile"); show(hint, true);
    label.textContent = "Rungkai fakta";
    text.textContent = "Tekan bola benang (atau butang di bawah) untuk rungkai fakta menarik dari video Kita Rungkai!";
    pullBtn.hidden = false; resetBtn.hidden = true; speak("Jom rungkai!"); pullBtn.focus();
  }
  function poke() {
    play(boy, "jump");
    var f = ["laugh", "shock", "grin"][Math.floor(Math.random() * 3)];
    face(f); speak(["Hehe!", "Eh, geli!", "Jom!"][Math.floor(Math.random() * 3)]);
    clearTimeout(faceTimer); faceTimer = setTimeout(function () { face(n >= FACTS.length ? "laugh" : "smile"); }, 1200);
  }
  function keyed(fn) { return function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } }; }
  $("yarnHit").addEventListener("click", pull); $("yarnHit").addEventListener("keydown", keyed(pull));
  $("boyHit").addEventListener("click", poke); $("boyHit").addEventListener("keydown", keyed(poke));
  pullBtn.addEventListener("click", pull); resetBtn.addEventListener("click", reset);

  // his eyes follow the pointer
  var svg = $("scene"), pupils = $("pupils");
  svg.addEventListener("pointermove", function (e) {
    try {
      var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      var q = pt.matrixTransform(svg.getScreenCTM().inverse());
      var dx = q.x - 125, dy = q.y - 110, d = Math.hypot(dx, dy) || 1, k = Math.min(2.6, d / 20);
      pupils.setAttribute("transform", "translate(" + (dx / d * k) + " " + (dy / d * k) + ")");
    } catch (err) {}
  });
  svg.addEventListener("pointerleave", function () { pupils.removeAttribute("transform"); });

  layout();
  try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) svg.pauseAnimations(); } catch (e) {}
})();
</script>
