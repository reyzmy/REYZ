<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nothing Here</title>

<!-- ============================================================
     HOW TO EDIT
     1. Put your image file next to this index.html and name it
        exactly "meme.jpg" (square image recommended).
     2. Put your sound file next to this index.html and name it
        exactly "jokowi.mp3" — tapping/clicking the image plays it.
     3. To change/add/remove phrases, edit the TEXTS array near
        the bottom of this file.
     4. To change how long each phrase shows, edit DURATION_MS
        (currently 3000 = 3 seconds).
     ============================================================ -->

<style>
  :root {
    --bg: #0B0B0D;
    --fg: #F5F5F3;
    --fg-soft: #8A8A90;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Noto Sans", sans-serif;
  }

  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 40px 20px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---- Rotating text ---- */
  .text-stage {
    position: relative;
    width: 100%;
    max-width: 640px;
    height: 3.4em;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .text-line {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.3;
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    transition: opacity 0.6s ease, transform 0.6s ease;
    padding: 0 12px;
  }

  .text-line.active {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* ---- Meme image ---- */
  .meme {
    width: min(340px, 80vw);
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #1A1A1D;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.6s ease-out 0.2s forwards;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .meme:active {
    transform: scale(0.96);
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }

  .meme img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="text-stage" id="stage" aria-live="polite"></div>

  <div class="meme" id="memeBtn" role="button" tabindex="0" aria-label="Play sound">
    <img src="meme.jpg" alt="meme" />
  </div>

  <audio id="memeSound" src="jokowi.mp3" preload="auto"></audio>

<script>
  // ============================================================
  // EDIT YOUR PHRASES HERE — order stays as listed, then loops.
  // ============================================================
  const TEXTS = [
    "Takde pape kat sini",
    "Nothing here",
    "这里什么都没有",
    "ここには何もない",
    "여기 아무것도 없어",
    "Il n\u2019y a rien ici",
    "No hay nada aqu\u00ed",
    "Hier ist nichts",
    "Non c\u2019\u00e8 niente qui",
    "N\u00e3o h\u00e1 nada aqui",
    "Здесь ничего нет",
    "لا يوجد شيء هنا",
    "यहाँ कुछ भी नहीं है",
    "ที่นี่ไม่มีอะไร",
    "Không có gì ở đây",
    "Burada hiçbir şey yok"
  ];

  const DURATION_MS = 3000; // how long each phrase stays visible

  // Right-to-left scripts get their direction set automatically
  const RTL_PATTERN = /[\u0591-\u07FF\u200F\uFB1D-\uFDFD\uFE70-\uFEFC]/;

  const stage = document.getElementById("stage");

  const lines = TEXTS.map(text => {
    const el = document.createElement("div");
    el.className = "text-line";
    el.textContent = text;
    if (RTL_PATTERN.test(text)) el.dir = "rtl";
    stage.appendChild(el);
    return el;
  });

  let i = 0;
  lines[0].classList.add("active");

  setInterval(() => {
    lines[i].classList.remove("active");
    i = (i + 1) % lines.length;
    lines[i].classList.add("active");
  }, DURATION_MS);

  // ---- Play sound on tap/click of the image ----
  const memeBtn = document.getElementById("memeBtn");
  const memeSound = document.getElementById("memeSound");

  function playSound() {
    memeSound.currentTime = 0;
    memeSound.play().catch(() => {
      // Some browsers block autoplay until a user gesture has
      // happened at least once — this click IS that gesture, so
      // a rejected promise here usually just means try again.
    });
  }

  memeBtn.addEventListener("click", playSound);
  memeBtn.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      playSound();
    }
  });
</script>

</body>
</html>
