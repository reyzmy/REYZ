<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Name — Links</title>
<meta name="description" content="All my social links in one place." />

<!-- ============================================================
     HOW TO EDIT THIS PAGE
     1. Change the page <title> above and the meta description.
     2. Edit YOUR_NAME and YOUR_TAGLINE in the HTML body below.
     3. Logo: drop your image file next to this index.html and name
        it exactly "logo-reyz.png" — it will auto-appear inside the
        circular gradient ring at the top of the page.
     4. Edit the LINKS array near the bottom of this file — that's
        the only place you need to add/remove/reorder platforms.
     ============================================================ -->

<style>
  :root {
    --bg: #F6F5F2;
    --ink: #16181C;
    --ink-soft: #565B63;
    --line: #DDDAD3;
    --card: #FFFFFF;
    --accent: #0082FB;      /* corporate blue */
    --accent-2: #0064E0;    /* darker end of the brand gradient */
    --accent-soft: #E8F2FE;
    --radius: 14px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 20px 40px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .page {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---- Logo mark: circular image with a brand-gradient ring ---- */
  .mark-ring {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(0,130,251,0.20);
    opacity: 0;
    transform: translateY(6px);
    animation: rise 0.5s ease-out forwards;
  }

  .mark-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: var(--card);
    border: 2px solid var(--card);
  }

  .identity {
    text-align: center;
    margin-top: 22px;
    opacity: 0;
    transform: translateY(6px);
    animation: rise 0.5s ease-out 0.08s forwards;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }

  .tagline {
    font-size: 14.5px;
    color: var(--ink-soft);
    margin: 0;
    line-height: 1.5;
  }

  /* ---- Links ---- */
  .links {
    width: 100%;
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 15px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--ink);
    font-weight: 500;
    font-size: 15px;
    opacity: 0;
    transform: translateY(6px);
    animation: rise 0.5s ease-out forwards;
    overflow: hidden;
    isolation: isolate;
    transition: color 0.25s ease, border-color 0.25s ease, transform 0.22s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease;
  }

  /* gradient fill that sweeps in from the left on hover */
  .link-card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.32s cubic-bezier(.2,.8,.2,1);
  }

  .link-card:hover,
  .link-card:focus-visible {
    color: #fff;
    border-color: transparent;
    transform: translateY(-3px);
    box-shadow: 0 10px 22px rgba(0,100,224,0.28);
  }

  .link-card:hover::before,
  .link-card:focus-visible::before {
    transform: scaleX(1);
  }

  .link-card:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  .link-card .icon {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
  }

  .link-card:hover .icon {
    background: rgba(255,255,255,0.22);
    color: #fff;
    transform: scale(1.08) rotate(-4deg);
  }

  .link-card .icon svg {
    width: 17px;
    height: 17px;
  }

  .link-card .label {
    flex: 1;
  }

  .link-card .go {
    color: var(--ink-soft);
    font-size: 16px;
    transform: translateX(0);
    transition: transform 0.25s ease, color 0.25s ease;
  }

  .link-card:hover .go {
    transform: translateX(4px);
    color: #fff;
  }

  footer {
    margin-top: 44px;
    font-size: 12.5px;
    color: var(--ink-soft);
    opacity: 0;
    animation: rise 0.5s ease-out 0.3s forwards;
  }

  footer a {
    color: var(--ink-soft);
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  /* stagger link cards */
  .link-card:nth-child(1) { animation-delay: 0.12s; }
  .link-card:nth-child(2) { animation-delay: 0.17s; }
  .link-card:nth-child(3) { animation-delay: 0.22s; }
  .link-card:nth-child(4) { animation-delay: 0.27s; }
  .link-card:nth-child(5) { animation-delay: 0.32s; }
  .link-card:nth-child(6) { animation-delay: 0.37s; }
  .link-card:nth-child(7) { animation-delay: 0.42s; }
  .link-card:nth-child(8) { animation-delay: 0.47s; }

  @media (max-width: 380px) {
    h1 { font-size: 23px; }
    .link-card { padding: 14px 16px; font-size: 14.5px; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- Logo: drop your image file named exactly "logo-reyz.png" next to this index.html -->
  <div class="mark-ring">
    <img class="mark-img" src="logo-reyz.png" alt="Reyz logo">
  </div>

  <div class="identity">
    <h1>Your Name</h1>
    <p class="tagline">Your tagline goes here — one short line about you.</p>
  </div>

  <nav class="links" id="links" aria-label="Social links"></nav>

  <footer>
    &copy; <span id="year"></span> Your Name
  </footer>

</div>

<script>
  // ============================================================
  // EDIT YOUR LINKS HERE. Add, remove, or reorder freely —
  // each entry is one card on the page.
  // "icon" keys map to the SVGs defined in the ICONS object below.
  // ============================================================
  const LINKS = [
    { label: "TikTok",      url: "https://tiktok.com/@yourhandle",     icon: "tiktok" },
    { label: "Instagram",   url: "https://instagram.com/yourhandle",   icon: "instagram" },
    { label: "YouTube",     url: "https://youtube.com/@yourhandle",    icon: "youtube" },
    { label: "Facebook",    url: "https://facebook.com/yourhandle",    icon: "facebook" },
    { label: "X / Twitter", url: "https://x.com/yourhandle",           icon: "x" },
    { label: "LinkedIn",    url: "https://linkedin.com/in/yourhandle", icon: "linkedin" }
  ];

  const ICONS = {
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 2h3a5.9 5.9 0 0 0 4.5 4.9v3.1a9 9 0 0 1-4.5-1.3v6.8a6.5 6.5 0 1 1-6.5-6.5c.3 0 .7 0 1 .1v3.2a3.3 3.3 0 1 0 2.3 3.2V2z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.5 9.3l5 2.7-5 2.7z" fill="currentColor" stroke="none"/></svg>',
    facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.6h2.6l.4-3h-3V8.4c0-.9.2-1.5 1.5-1.5h1.6V4.3C15.9 4.2 15 4.1 13.9 4.1c-2.2 0-3.7 1.3-3.7 3.8v2.5H7.6v3h2.6V21h3.3z"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4l7.3 9.1L4.4 20h2l6-6.6 4.6 6.6H20l-7.6-9.6L19.6 4h-2l-5.5 6-4.2-6H4z"/></svg>',
    linkedin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="7.5" cy="8" r="0.9" fill="currentColor" stroke="none"/><path d="M7.5 11v6M12 17v-4a2 2 0 0 1 4 0v4M12 13v4"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 15l6-6M8.5 13.5L6 16a3.5 3.5 0 0 0 5 5l2.5-2.5M15.5 10.5L18 8a3.5 3.5 0 0 0-5-5l-2.5 2.5"/></svg>'
  };

  const nav = document.getElementById("links");
  LINKS.forEach(link => {
    const a = document.createElement("a");
    a.className = "link-card";
    a.href = link.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `
      <span class="icon">${ICONS[link.icon] || ICONS.link}</span>
      <span class="label">${link.label}</span>
      <span class="go" aria-hidden="true">&#8594;</span>
    `;
    nav.appendChild(a);
  });

  document.getElementById("year").textContent = new Date().getFullYear();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

</body>
</html>
